<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff2d95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff9c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path class="logo-path" d="M50 100 L100 50 L150 100 L100 150 Z" fill="none" stroke="url(#neonGradient)" stroke-width="3" filter="url(#glow)"/>
  <text x="100" y="120" text-anchor="middle" class="logo-text" fill="url(#neonGradient)" font-size="24" font-family="Orbitron, Arial" font-weight="bold" filter="url(#glow)">MAA</text>
</svg>
